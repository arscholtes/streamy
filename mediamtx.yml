# MediaMTX Configuration for StreamHub

# Log level
logLevel: info
logDestinations: [stdout]

# Authentication
externalAuthenticationURL: http://host.docker.internal:3000/rtmp/auth

# Webhooks for stream events
runOnPublish: curl -X POST http://host.docker.internal:3000/rtmp/webhooks/publish -H "Content-Type: application/json" -d '{"path":"$MTX_PATH","user":"$MTX_QUERY_user"}'
runOnUnPublish: curl -X POST http://host.docker.internal:3000/rtmp/webhooks/unpublish -H "Content-Type: application/json" -d '{"path":"$MTX_PATH","user":"$MTX_QUERY_user"}'

# RTMP Server
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# HLS Server
hls: yes
hlsAddress: :8889
hlsAllowOrigin: "*"
hlsAlwaysRemux: no
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# WebRTC Server
webrtc: yes
webrtcAddress: :8189

# Playback Server
playback: yes
playbackAddress: :8888

# Paths - accept any stream key
paths:
  all:
    record: no
